{% extends "base.html" %}
{% block content %}
<div class="qr-block">
    <div style="text-align:center;">
        <img src="{{ report_qr }}" alt="QR-код на отчёт">
        <p style="font-size:13px; color:#666;">{{ site_settings.qr_hint_text }}</p>
    </div>
</div>
{% include "report/_report_body.html" %}
<div class="qr-block">
    <div style="text-align:center;">
        <img src="{{ report_qr }}" alt="QR-код на отчёт">
        <p style="font-size:13px; color:#666;">Ссылка на этот отчёт: <a href="{{ report_url }}">{{ report_url }}</a></p>
    </div>
</div>
<div class="action-buttons">
    <a href="{% url 'landing' %}" class="btn-secondary">Начать новый опрос</a>
</div>
{% if site_settings.logo %}
<div style="text-align:center; margin-top:24px;">
    <img src="{{ site_settings.logo.url }}" alt="{{ site_settings.company_name }}" class="logo" style="max-height:60px; margin-bottom:0;">
</div>
{% endif %}
<p style="text-align:center; margin-top:20px; font-size:14px;">
    <a href="https://icl-st.ru" target="_blank" rel="noopener">icl-st.ru</a>
</p>
{% endblock %}
