{% extends "base.html" %}
{% block content %}
<div class="landing-screen">
    {% if settings.logo %}
        <a href="{{ settings.company_website }}" target="_blank" rel="noopener">
            <img src="{{ settings.logo.url }}" alt="{{ settings.company_name }}" class="logo">
        </a>
    {% else %}
        <h2 style="color: var(--primary);"><a href="{{ settings.company_website }}" target="_blank" rel="noopener" style="color: inherit; text-decoration: none;">{{ settings.company_name }}</a></h2>
    {% endif %}
    <h1 class="landing-title">{{ settings.landing_title }}</h1>
    <p class="landing-subtitle">{{ settings.landing_subtitle }}</p>
    <div class="landing-buttons">
        <a href="{% url 'survey_start' %}" class="btn-big">{{ settings.button_text }}</a>
        <a href="{% url 'survey_start' %}" class="btn-big">{{ settings.button_text }}</a>
    </div>
</div>
{% endblock %}
