{% if site_settings.telegram_url or site_settings.max_url %}
<div class="social-links">
    {% if site_settings.telegram_url %}
    <a class="social-link social-telegram" href="{{ site_settings.telegram_url }}" target="_blank" rel="noopener">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
        <span class="social-caption">Наш телеграм-канал</span>
    </a>
    {% endif %}
    {% if site_settings.max_url %}
    <a class="social-link social-max" href="{{ site_settings.max_url }}" target="_blank" rel="noopener">
        <svg class="social-icon social-icon-max" viewBox="0 0 1080 1080" aria-hidden="true" focusable="false">
            <defs>
                <linearGradient id="maxBg" x1="0" y1="1" x2="1" y2="0">
                    <stop offset="0" stop-color="#44CCFF"/>
                    <stop offset="0.5" stop-color="#5533EE"/>
                    <stop offset="1" stop-color="#9933DD"/>
                </linearGradient>
                <linearGradient id="maxInner" x1="0" y1="1" x2="1" y2="0">
                    <stop offset="0" stop-color="#4FA3FF"/>
                    <stop offset="1" stop-color="#4B2EE0"/>
                </linearGradient>
            </defs>
            <rect width="1080" height="1080" rx="270" fill="url(#maxBg)"/>
            <path fill="#fff" d="M548 130C320 130 128 316 128 545c0 150 58 270 58 365 0 70 70 50 130 20 20-12 40-25 48-42 90 65 130 75 184 75 228 0 404-186 404-418S776 130 548 130z"/>
            <path fill="url(#maxInner)" d="M541 330c-120 0-210 100-210 255 0 90 25 165 40 165 12 0 45-25 58-40 38 25 74 37 112 37 118 0 208-95 208-208S659 330 541 330z"/>
        </svg>
        <span class="social-caption">Мы в MAX</span>
    </a>
    {% endif %}
</div>
{% endif %}
