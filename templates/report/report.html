{% extends "base.html" %}
{% block content %}
{% include "report/_report_body.html" %}
<h3 class="section-title">Свяжитесь с {{ site_settings.company_name }}</h3>
<div class="qr-block">
    <div style="text-align:center;">
        <img src="{{ website_qr }}" alt="QR-код на сайт">
        <p><a href="{{ site_settings.company_website }}" target="_blank" rel="noopener">{{ site_settings.company_website }}</a></p>
    </div>
    <div style="text-align:center;">
        <img src="{{ mailto_qr }}" alt="QR-код для письма">
        <p><a href="mailto:{{ site_settings.company_email }}">{{ site_settings.company_email }}</a></p>
    </div>
</div>
{% if site_settings.logo %}
<div style="text-align:center; margin-top:24px;">
    <img src="{{ site_settings.logo.url }}" alt="{{ site_settings.company_name }}" class="logo" style="max-height:60px; margin-bottom:0;">
</div>
{% endif %}
{% endblock %}
